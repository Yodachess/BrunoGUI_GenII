Moteur = Stockfish 17
Sitemoteur = https://stockfishchess.org/
; Couleurs : nom de couleur .NET (ex : Peru) ou code hexadécimal (ex : #B58863)
Casesombre = Peru
Caseclaire = Wheat
CouleurCaseSource = DarkSeaGreen
CouleurCaseDestination = DarkKhaki
; Style Lichess (couleurs utilisées si le fichier ou une clé est absent) : remplacer les 4 lignes ci-dessus par
; Casesombre = #B58863
; Caseclaire = #F0D9B5
; CouleurCaseSource = #86A66C
; CouleurCaseDestination = #C4C87F
NomHumain = Bruno
EloHumain = 1767
DureereflexionSeconde = 5
; LimiteForce : non utilisée (la force est limitée à chaque nouvelle partie, sauf "force maximale")
LimiteForce = true
Forcemoteur = 1950
; Tempsreflexion : ancienne clé en millisecondes, non utilisée (voir DureereflexionSeconde)
Tempsreflexion = 2000
NombrelignesPV = 3
; NombreCoeursThread (Threads) et TableHachage (Hash, en Mo) sont envoyés au moteur à son démarrage
NombreCoeursThread = 4
TableHachage = 256 min
Bibliotheque = rodent.bin
