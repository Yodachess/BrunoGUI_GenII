# Publication d'une version : quand un tag "v..." est poussé (ex : v1.03), GitHub compile BrunoGUI_GenII,
# lance les tests, prépare une archive portable (avec la dernière version de Stockfish) et crée une
# "Release" GitHub avec cette archive, prête à télécharger.
#   Créer et pousser un tag :  git tag v1.03   puis   git push BrunoGUI_GenII v1.03
name: Publication

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write           # nécessaire pour créer la Release

jobs:
  publication:
    runs-on: windows-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Le numéro de version de l'application est la balise <Version> du .csproj : le tag doit lui correspondre (v1.16 <-> 1.16),
      # sinon l'archive publiée afficherait un autre numéro que celui de la Release
      - name: Vérification du numéro de version
        run: |
          [xml]$projet = Get-Content BrunoGUI_GenII.csproj
          $version = @($projet.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Le tag ${{ github.ref_name }} ne correspond pas à la version du .csproj ($version)" }
          Write-Host "Version $version"

      - name: Compilation
        run: dotnet build BrunoGUI_GenII.sln -c Release

      - name: Tests (une version n'est publiée que si tous les tests passent)
        run: dotnet run --project Tests -c Release --no-build -- --complet

      # Archive autonome : .NET 10 y est inclus, l'utilisateur n'a rien à installer (avant, il fallait le .NET 10 Desktop Runtime,
      # une étape où un joueur occasionnel risque d'abandonner) ; seulement les ressources françaises et anglaises du runtime
      - name: Publication autonome (avec .NET)
        run: dotnet publish BrunoGUI_GenII.csproj -c Release -r win-x64 --self-contained true -p:SatelliteResourceLanguages="fr%3Ben" -o publie

      - name: Dernière version de Stockfish (évite un téléchargement au premier lancement)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/official-stockfish/Stockfish/releases/latest | ConvertFrom-Json
          $fichier = $release.assets | Where-Object { $_.name -like "*windows*x86-64*.zip" } |
                     Sort-Object { if ($_.name -like "*universal*") { 0 } else { 1 } } | Select-Object -First 1
          if (-not $fichier) { throw "Aucun Stockfish Windows x86-64 dans la release $($release.tag_name)" }
          Write-Host "Stockfish $($release.tag_name) : $($fichier.name)"
          Invoke-WebRequest $fichier.browser_download_url -OutFile stockfish.zip
          Expand-Archive stockfish.zip -DestinationPath stockfish_extrait
          $exe = Get-ChildItem stockfish_extrait -Recurse -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName publie/stockfish/stockfish.exe -Force

      - name: Archive portable
        run: |
          $sortie = "publie"
          # Fichiers de débogage : inutiles dans une archive portable
          Remove-Item "$sortie/*.pdb" -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "$sortie/BrunoGUI_GenII.exe") -or -not (Test-Path "$sortie/stockfish/stockfish.exe") -or -not (Test-Path "$sortie/Aide/fr/index.html")) { throw "Archive incomplète" }
          Compress-Archive -Path "$sortie/*" -DestinationPath "BrunoGUI_GenII-${{ github.ref_name }}.zip"

      - name: PDF de l'aide (français et anglais)
        timeout-minutes: 5
        run: ./.github/aide-pdf.ps1

      # Notes de la release : installation, déblocage du zip et avertissement SmartScreen (programme non signé), en français et en anglais
      - name: Création de la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "BrunoGUI_GenII-${{ github.ref_name }}.zip"
          BrunoGUI_Aide_fr.pdf BrunoGUI_Aide_en.pdf
          --title "BrunoGUI GenII ${{ github.ref_name }}"
          --notes-file .github/notes-publication.md
